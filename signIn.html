<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR ATELIER</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&amp;family=Outfit:wght@200;300;400;500&amp;display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        .fashion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100%;
            width: 100%;
        }

        @media (max-width: 768px) {
            .fashion-grid { grid-template-columns: 1fr; }
            .visual-side { display: none; }
        }

        .visual-side {
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Editorial geometric pattern */
        .geo-line {
            position: absolute;
            background: rgba(255,255,255,0.06);
        }

        .diagonal-stripe {
            position: absolute;
            width: 200%;
            height: 1px;
            background: rgba(255,255,255,0.1);
            transform-origin: 0 0;
        }

        /* Floating fashion silhouette using CSS */
        .silhouette-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .silhouette {
            width: 280px;
            height: 420px;
            position: relative;
            opacity: 0;
            animation: silhouetteFadeIn 1.8s ease forwards 0.5s;
        }

        @keyframes silhouetteFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .silhouette-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 320px;
            background: linear-gradient(180deg, #fff 0%, #e0e0e0 100%);
            clip-path: polygon(30% 0%, 70% 0%, 85% 25%, 80% 60%, 90% 100%, 10% 100%, 20% 60%, 15% 25%);
        }

        .silhouette-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 75px;
            background: #fff;
            border-radius: 50% 50% 45% 45%;
        }

        .silhouette-hat {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
        }
        .silhouette-hat::after {
            content: '';
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 30px;
            background: #fff;
            border-radius: 20px 20px 0 0;
        }

        /* Overlay text on visual side */
        .editorial-text {
            position: absolute;
            bottom: 60px;
            left: 40px;
            right: 40px;
            z-index: 10;
            opacity: 0;
            animation: slideUp 1s ease forwards 1.2s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .editorial-year {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: 11px;
            letter-spacing: 6px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
        }

        .editorial-headline {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-style: italic;
            font-size: 42px;
            color: #fff;
            line-height: 1.1;
            margin-top: 8px;
        }

        /* Form side */
        .form-side {
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            overflow-y: auto;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
            opacity: 0;
            animation: formFadeIn 1s ease forwards 0.3s;
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .brand-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: 13px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #000;
            margin-bottom: 60px;
        }

        .welcome-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 38px;
            color: #000;
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .welcome-sub {
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: 13px;
            color: #999;
            letter-spacing: 1px;
            margin-bottom: 44px;
        }

        /* Input styling */
        .fashion-input-group {
            position: relative;
            margin-bottom: 28px;
        }

        .fashion-label {
            display: block;
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .fashion-input {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-bottom: 1px solid #e0e0e0;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 15px;
            color: #000;
            outline: none;
            transition: border-color 0.4s ease;
        }

        .fashion-input::placeholder {
            color: #ccc;
            font-weight: 200;
        }

        .fashion-input:focus {
            border-bottom-color: #000;
        }

        .fashion-input:focus ~ .input-line {
            transform: scaleX(1);
        }

        .fashion-input:focus + .fashion-label,
        .fashion-input-group:focus-within .fashion-label {
            color: #000;
        }

        .input-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #000;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Submit button */
        .fashion-btn {
            width: 100%;
            padding: 18px;
            margin-top: 16px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fashion-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            transform: translateX(-101%);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fashion-btn:hover {
            color: #000;
        }

        .fashion-btn:hover::before {
            transform: translateX(0);
        }

        .fashion-btn span {
            position: relative;
            z-index: 1;
        }

        /* Links */
        .fashion-link {
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 11px;
            color: #aaa;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            position: relative;
        }

        .fashion-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: #000;
            transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fashion-link:hover {
            color: #000;
        }

        .fashion-link:hover::after {
            width: 100%;
        }

        /* Corner decorations */
        .corner-mark {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-400px) rotate(360deg); opacity: 0; }
        }

        /* Toast */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #000;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 2px;
            padding: 16px 32px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
            pointer-events: none;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Subtle demo notice */
        .demo-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Outfit', sans-serif;
            font-weight: 200;
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ccc;
            padding: 4px 10px;
            border: 1px solid #eee;
        }
    </style>
    <style>body { box-sizing: border-box; }</style>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>
<body class="h-full" style="width:100%;">
<div class="fashion-grid" style="height:100%;width:100%;"><!-- Visual/Editorial Side -->
    <div class="visual-side">
        <div class="corner-mark corner-tl"></div>
        <div class="corner-mark corner-tr"></div>
        <div class="corner-mark corner-bl"></div>
        <div class="corner-mark corner-br"></div><!-- Geometric lines -->
        <div class="geo-line" style="top:0;left:33.3%;width:1px;height:100%;"></div>
        <div class="geo-line" style="top:0;left:66.6%;width:1px;height:100%;"></div>
        <div class="diagonal-stripe" style="top:40%;left:0;transform:rotate(-25deg);"></div>
        <div class="diagonal-stripe" style="top:70%;left:0;transform:rotate(-25deg);"></div><!-- Particles -->
        <div id="particles"></div><!-- Fashion Silhouette -->
        <div class="silhouette-container">
            <div class="silhouette">
                <div class="silhouette-hat"></div>
                <div class="silhouette-head"></div>
                <div class="silhouette-body"></div>
            </div>
        </div><!-- Editorial text overlay -->
        <div class="editorial-text">
            <div class="editorial-year">
                Autumn / Winter 2025
            </div>
            <div class="editorial-headline" id="editorialHeadline">
                The Art<br>
                of Being.
            </div>
        </div>
    </div><!-- Form Side -->
    <div class="form-side">
        <div class="demo-badge">
            Sample
        </div>
        <div class="form-wrapper">
            <div class="brand-logo" id="brandLogo">
                NOIR ATELIER
            </div>
            <h1 class="welcome-text" id="welcomeHeading">Welcome Back</h1>
            <p class="welcome-sub" id="tagline">Where elegance meets edge.</p>
            <form id="fashionForm" onsubmit="return false;">
                <div class="fashion-input-group"><label class="fashion-label" for="email">Email Address</label> <input class="fashion-input" type="email" id="email" placeholder="you@example.com" required>
                    <div class="input-line"></div>
                </div>
                <div class="fashion-input-group"><label class="fashion-label" for="name">Your Name</label> <input class="fashion-input" type="text" id="name" placeholder="First &amp; Last name">
                    <div class="input-line"></div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><a href="#" class="fashion-link" onclick="event.preventDefault();showToast('LINK DEMO ONLY')">Forgot details?</a> <a href="#" class="fashion-link" onclick="event.preventDefault();showToast('LINK DEMO ONLY')">Create account</a>
                </div><button type="submit" class="fashion-btn" id="submitBtn" onclick="handleSubmit(event)"> <span id="btnText">Enter the Collection</span> </button>
            </form>
            <div style="margin-top:48px;display:flex;gap:20px;justify-content:center;"><a href="#" class="fashion-link" onclick="event.preventDefault();" style="font-size:10px;letter-spacing:2px;">Terms</a> <span style="color:#e0e0e0;font-size:10px;">|</span> <a href="#" class="fashion-link" onclick="event.preventDefault();" style="font-size:10px;letter-spacing:2px;">Privacy</a>
            </div>
        </div>
    </div>
</div>
<div class="toast-msg" id="toast"></div>
<script>
    // Particles
    const particleContainer = document.getElementById('particles');
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.bottom = '-10px';
        p.style.animationDuration = (6 + Math.random() * 8) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        particleContainer.appendChild(p);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function handleSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        if (!email) { showToast('PLEASE ENTER YOUR EMAIL'); return; }
        showToast('WELCOME — THIS IS A SAMPLE DEMO');
    }

    // Element SDK
    const defaultConfig = {
        brand_name: 'NOIR ATELIER',
        welcome_heading: 'Welcome Back',
        tagline: 'Where elegance meets edge.',
        button_text: 'Enter the Collection',
        background_color: '#000000',
        surface_color: '#ffffff',
        text_color: '#000000',
        primary_action_color: '#000000',
        secondary_action_color: '#999999',
        font_family: 'Cormorant Garamond',
        font_size: 16
    };

    function applyConfig(config) {
        const c = { ...defaultConfig, ...config };

        document.getElementById('brandLogo').textContent = c.brand_name;
        document.getElementById('welcomeHeading').textContent = c.welcome_heading;
        document.getElementById('tagline').textContent = c.tagline;
        document.getElementById('btnText').textContent = c.button_text;

        // Colors
        const visualSide = document.querySelector('.visual-side');
        if (visualSide) visualSide.style.background = c.background_color;

        const formSide = document.querySelector('.form-side');
        formSide.style.background = c.surface_color;

        document.getElementById('welcomeHeading').style.color = c.text_color;
        document.querySelectorAll('.fashion-label').forEach(l => l.style.color = c.secondary_action_color);
        document.querySelectorAll('.fashion-input').forEach(i => i.style.color = c.text_color);

        const btn = document.getElementById('submitBtn');
        btn.style.background = c.primary_action_color;
        btn.style.borderColor = c.primary_action_color;

        document.querySelectorAll('.fashion-link').forEach(l => l.style.color = c.secondary_action_color);

        // Fonts
        const heading = `${c.font_family}, Cormorant Garamond, serif`;
        const body = `Outfit, sans-serif`;
        document.getElementById('welcomeHeading').style.fontFamily = heading;
        document.getElementById('editorialHeadline').style.fontFamily = heading;

        // Font size
        const base = c.font_size || 16;
        document.getElementById('welcomeHeading').style.fontSize = `${base * 2.375}px`;
        document.getElementById('tagline').style.fontSize = `${base * 0.8125}px`;
        document.querySelectorAll('.fashion-input').forEach(i => i.style.fontSize = `${base * 0.9375}px`);
    }

    if (window.elementSdk) {
        window.elementSdk.init({
            defaultConfig,
            onConfigChange: async (config) => applyConfig(config),
            mapToCapabilities: (config) => {
                const c = { ...defaultConfig, ...config };
                const mk = (key) => ({
                    get: () => c[key] || defaultConfig[key],
                    set: (v) => { c[key] = v; window.elementSdk.setConfig({ [key]: v }); }
                });
                return {
                    recolorables: [
                        mk('background_color'),
                        mk('surface_color'),
                        mk('text_color'),
                        mk('primary_action_color'),
                        mk('secondary_action_color')
                    ],
                    borderables: [],
                    fontEditable: mk('font_family'),
                    fontSizeable: {
                        get: () => c.font_size || defaultConfig.font_size,
                        set: (v) => { c.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
                    }
                };
            },
            mapToEditPanelValues: (config) => {
                const c = { ...defaultConfig, ...config };
                return new Map([
                    ['brand_name', c.brand_name],
                    ['welcome_heading', c.welcome_heading],
                    ['tagline', c.tagline],
                    ['button_text', c.button_text]
                ]);
            }
        });
    }
</script>
